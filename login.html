<body data-page="login">

<div><span class="eyebrow" style="color:#7ff0ff">Employee access</span><h1>Welcome back to the RELIABLE team</h1><p>Sign in with your company credentials to see Reliable OPC’s internal information.</p><div class="lock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> For authorized Reliable OPC employees only</div></div>
<form class="acard" id="login-form" autocomplete="on"><h2>Employee login</h2><p>Enter your work email and password.</p>
<div class="fl"><input type="email" id="username" name="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" placeholder=" " autocomplete="username" required><label for="username">Work email</label></div>
<div class="fl"><input type="password" id="password" name="password" enterkeyhint="go" placeholder=" " autocomplete="current-password" required><label for="password">Password</label><button type="button" class="pwt" id="pwt" aria-label="Show or hide password">Show</button></div>
<div class="ark"><label><input type="checkbox" id="remember"> Keep me signed in</label><button type="button" id="forgot" class="lk">Forgot password?</button></div>
<div class="err" id="lerr" role="alert"></div><button class="btn" type="submit">Sign in</button></form></div></section>
